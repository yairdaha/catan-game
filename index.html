<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המתיישבים - גרסת הגוש</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a2a3a; color: #eee; overflow-x: hidden; }
    button:hover:not(:disabled) { transform: scale(1.05); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input { font-family: inherit; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  
  <script>
let myId = localStorage.getItem('myId') || Math.random().toString(36).slice(2, 8).toUpperCase();
localStorage.setItem('myId', myId);

let gameState = null;
let currentScreen = 'home';
let gameCode = '';
let myName = '';
let error = '';

const RE = { wood: '🌸', brick: '🏖️', wheat: '🍅', sheep: '🥬', ore: '🌱' };
const RN = { wood: 'פרחים', brick: 'חול', wheat: 'עגבניות', sheep: 'חסות', ore: 'זרעים' };
const PC = ['#2563eb', '#dc2626', '#059669', '#d97706'];

function checkURL() {
  const urlParams = new URLSearchParams(window.location.search);
  const encoded = urlParams.get('game');
  
  if (encoded) {
    try {
      const json = pako.inflate(Buffer.from(encoded, 'base64'), { to: 'string' });
      gameState = JSON.parse(json);
      gameCode = gameState.code;
      currentScreen = 'lobby';
      loadLocal();
      return true;
    } catch (e) {
      error = 'קוד משחק לא תקין';
    }
  }
  return false;
}

function save() {
  if (!gameCode || !gameState) return;
  const key = `game:${gameCode}`;
  localStorage.setItem(key, JSON.stringify({
    ...gameState,
    lastUpdate: Date.now()
  }));
  updateURL();
}

function loadLocal() {
  if (!gameCode) return;
  const key = `game:${gameCode}`;
  try {
    const stored = localStorage.getItem(key);
    if (stored) {
      const loaded = JSON.parse(stored);
      if (loaded.lastUpdate > (gameState?.lastUpdate || 0)) {
        gameState = loaded;
      }
    }
  } catch (e) {}
}

function updateURL() {
  if (!gameCode || !gameState) return;
  try {
    const json = JSON.stringify(gameState);
    const compressed = Buffer.from(pako.deflate(json)).toString('base64');
    const url = `${window.location.origin}${window.location.pathname}?game=${compressed}`;
    window.history.replaceState({}, '', url);
  } catch (e) {}
}

function createGame() {
  if (!myName.trim()) { error = 'הכנס שם'; render(); return; }
  gameCode = Math.random().toString(36).slice(2, 6).toUpperCase();
  gameState = {
    code: gameCode,
    phase: 'lobby',
    players: [{ id: myId, name: myName.trim() }],
    host: myId,
    createdAt: Date.now(),
    lastUpdate: Date.now()
  };
  currentScreen = 'lobby';
  error = '';
  save();
  render();
}

function joinGame(code) {
  if (!myName.trim()) { error = 'הכנס שם'; render(); return; }
  if (!code || code.length !== 4) { error = 'קוד לא תקין'; render(); return; }
  gameCode = code.toUpperCase();
  const key = `game:${gameCode}`;
  try {
    const stored = localStorage.getItem(key);
    if (!stored) { error = `משחק לא נמצא (קוד: ${gameCode})`; render(); return; }
    const state = JSON.parse(stored);
    if (state.phase !== 'lobby') { error = 'המשחק כבר התחיל'; render(); return; }
    if (state.players.length >= 4) { error = 'המשחק מלא'; render(); return; }
    const players = state.players || [];
    if (!players.find(p => p.id === myId)) {
      players.push({ id: myId, name: myName.trim() });
      state.players = players;
      state.lastUpdate = Date.now();
    }
    gameState = state;
    currentScreen = 'lobby';
    error = '';
    save();
    render();
  } catch (e) { error = 'שגיאה בהצטרפות'; render(); }
}

function startGame() {
  if (!gameCode || !gameState) return;
  gameState = {
    ...gameState,
    phase: 'playing',
    players: gameState.players.map(p => ({...p, resources: { wood: 0, brick: 0, wheat: 0, sheep: 0, ore: 0 }, vp: 0})),
    currentPlayer: 0,
    turnPhase: 'preroll',
    dice: null,
    log: ['🎲 המשחק התחיל!'],
    lastUpdate: Date.now()
  };
  currentScreen = 'game';
  save();
  render();
}

function endTurn() {
  if (!gameCode || !gameState) return;
  const nextP = (gameState.currentPlayer + 1) % gameState.players.length;
  gameState.currentPlayer = nextP;
  gameState.turnPhase = 'preroll';
  gameState.dice = null;
  gameState.log.push(`➡️ תור של ${gameState.players[nextP].name}`);
  gameState.lastUpdate = Date.now();
  save();
  render();
}

function rollDice() {
  if (!gameCode || !gameState) return;
  const d1 = Math.floor(Math.random() * 6) + 1;
  const d2 = Math.floor(Math.random() * 6) + 1;
  gameState.dice = [d1, d2];
  gameState.turnPhase = 'postroll';
  gameState.log.push(`🎲 ${gameState.players[gameState.currentPlayer].name} הטיל ${d1}+${d2}=${d1 + d2}`);
  gameState.lastUpdate = Date.now();
  save();
  render();
}

function copyGameLink() {
  if (!gameCode || !gameState) return;
  try {
    const json = JSON.stringify(gameState);
    const compressed = Buffer.from(pako.deflate(json)).toString('base64');
    const url = `${window.location.origin}${window.location.pathname}?game=${compressed}`;
    navigator.clipboard.writeText(url).then(() => {
      alert('הקישור הועתק!');
    }).catch(() => {
      alert(`קוד המשחק: ${gameCode}`);
    });
  } catch (e) {
    alert(`קוד המשחק: ${gameCode}`);
  }
}

setInterval(() => {
  if (currentScreen === 'lobby' || currentScreen === 'game') {
    loadLocal();
    render();
  }
}, 500);

function render() {
  const app = document.getElementById('app');
  
  if (currentScreen === 'home') {
    app.innerHTML = `
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1e3a5f 100%);">
        <div style="background: #faf3e0; border-radius: 16px; padding: 32px; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center;">
          <div style="font-size: 48px; margin-bottom: 8px;">🌱</div>
          <h1 style="margin: 0 0 4px; font-size: 28px; color: #2c1810; font-weight: 800;">המתיישבים - גרסת הגוש</h1>
          <p style="margin: 0 0 24px; color: #8b7355; font-size: 14px;">משחק אסטרטגיה מרובה משתתפים</p>
          ${error ? `<div style="background: #fee; color: #c00; padding: 8px; border-radius: 8px; margin-bottom: 12px; font-size: 13px;">${error}</div>` : ''}
          <input id="nameInput" placeholder="השם שלך" value="${myName}" onchange="myName = this.value; error = '';" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 2px solid #d4c5a9; font-size: 16px; margin-bottom: 12px; text-align: right; background: #fff;" />
          <button onclick="createGame();" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 12px;">🎮 צור משחק חדש</button>
          <div style="display: flex; gap: 8px;">
            <input id="codeInput" placeholder="קוד משחק" maxlength="4" onchange="error = '';" style="flex: 1; padding: 10px 12px; border-radius: 8px; border: 2px solid #d4c5a9; font-size: 16px; text-align: center; letter-spacing: 4px; font-weight: 700; background: #fff;" />
            <button onclick="myName = document.getElementById('nameInput').value; joinGame(document.getElementById('codeInput').value);" style="padding: 10px 20px; border-radius: 8px; border: none; background: #059669; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">הצטרף</button>
          </div>
        </div>
      </div>
    `;
  } else if (currentScreen === 'lobby') {
    const isHost = gameState?.host === myId;
    app.innerHTML = `
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1e3a5f 100%);">
        <div style="background: #faf3e0; border-radius: 16px; padding: 32px; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center;">
          <h2 style="margin: 0 0 8px; color: #2c1810;">ממתינים לשחקנים...</h2>
          <div style="background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 2px dashed #d4c5a9;">
            <div style="font-size: 12px; color: #8b7355; margin-bottom: 4px;">קוד המשחק</div>
            <div style="font-size: 36px; font-weight: 900; letter-spacing: 8px; color: #2563eb;">${gameCode}</div>
            <button onclick="copyGameLink();" style="margin-top: 8px; padding: 6px 12px; border-radius: 6px; border: none; background: #e67e22; color: #fff; font-size: 12px; cursor: pointer;">🔗 העתק קישור</button>
          </div>
          <div style="text-align: right; margin-bottom: 16px;">
            <div style="font-size: 14px; font-weight: 600; color: #2c1810; margin-bottom: 8px;">שחקנים (${gameState?.players?.length || 0}/4):</div>
            ${gameState?.players && gameState.players.length > 0 ? gameState.players.map((p, i) => `<div style="display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; direction: rtl;"><div style="width: 12px; height: 12px; border-radius: 6px; background: ${PC[i % PC.length]};"></div><span style="font-size: 15px;">${p.name}</span>${p.id === gameState.host ? '<span style="font-size: 11px; color: #888; margin-right: 4px;">(מארח)</span>' : ''}${p.id === myId ? '<span style="font-size: 11px; color: #2563eb; margin-right: 4px;">(אתה)</span>' : ''}</div>`).join('') : '<div style="color: #999; font-size: 13px; padding: 8px 0;">שום שחקנים עדיין</div>'}
          </div>
          ${isHost && (gameState?.players?.length || 0) >= 2 ? `<button onclick="startGame();" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">🚀 התחל משחק (${gameState.players.length} שחקנים)</button>` : isHost ? `<p style="color: #888; font-size: 13px;">צריך לפחות 2 שחקנים</p>` : `<p style="color: #888; font-size: 13px;">ממתין שהמארח יתחיל...</p>`}
        </div>
      </div>
    `;
  } else if (currentScreen === 'game') {
    const me = gameState?.players?.find(p => p.id === myId);
    const curPlayer = gameState?.players?.[gameState?.currentPlayer];
    app.innerHTML = `
      <div style="min-height: 100vh; background: #1a2a3a; display: flex; flex-direction: column; color: #eee;">
        <div style="background: #0f1f2e; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3a4a;">
          <div style="display: flex; align-items: center; gap: 12px;"><span style="font-size: 20px;">🌱</span><span style="font-weight: 700; font-size: 16px;">המתיישבים - גרסת הגוש</span></div>
          <div style="font-size: 13px; color: #88a0b8;">תור: ${curPlayer?.name || ''}</div>
        </div>
        <div style="flex: 1; display: flex; gap: 8; padding: 8px; overflow: auto;">
          <div style="flex: 1 1 460px; display: flex; align-items: center; justify-content: center; padding: 8px; min-width: 320px;">
            <svg viewBox="0 0 460 420" style="width: 100%; max-width: 500px; height: auto;"><rect width="460" height="420" fill="#1a6fa0" rx="12"/><text x="230" y="210" text-anchor="middle" dominant-baseline="middle" font-size="32" fill="#88a0b8">🎮 משחק בהכנה</text></svg>
          </div>
          <div style="flex: 0 0 280px; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; min-width: 260px; max-height: calc(100vh - 52px); overflow-y: auto;">
            <div style="background: #0f1f2e; border-radius: 10px; padding: 12px;">
              <div style="font-size: 14px; text-align: center; font-weight: 700;">${gameState?.currentPlayer === gameState?.players?.findIndex(p => p.id === myId) ? 'התור שלך!' : `תור של ${curPlayer?.name || ''}`}</div>
              ${gameState?.dice ? `<div style="font-size: 28px; margin-top: 8px; text-align: center;">${gameState.dice[0]} + ${gameState.dice[1]} = ${gameState.dice[0] + gameState.dice[1]}</div>` : ''}
              ${gameState?.currentPlayer === gameState?.players?.findIndex(p => p.id === myId) && gameState?.turnPhase === 'preroll' ? `<button onclick="rollDice();" style="margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: none; background: #e74c3c; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">🎲 הטל קוביות</button>` : ''}
              ${gameState?.currentPlayer === gameState?.players?.findIndex(p => p.id === myId) && gameState?.turnPhase === 'postroll' ? `<button onclick="endTurn();" style="margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: none; background: #e67e22; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">סיים תור</button>` : ''}
            </div>
            ${me ? `<div style="background: #0f1f2e; border-radius: 10px; padding: 12px;"><div style="font-size: 12px; color: #88a0b8; margin-bottom: 6px;">המשאבים שלי</div><div style="display: flex; flex-wrap: wrap; gap: 6px;">${Object.entries(RE).map(([r, emoji]) => `<div style="display: flex; align-items: center; gap: 4px; background: #1a2a3a; border-radius: 6px; padding: 4px 8px; font-size: 14px;"><span>${emoji}</span><span style="font-weight: 700;">${me.resources[r] || 0}</span></div>`).join('')}</div></div>` : ''}
            <div style="background: #0f1f2e; border-radius: 10px; padding: 10px; flex: 1 1 80px; overflow-y: auto; min-height: 80px;">
              <div style="font-size: 11px; color: #88a0b8; margin-bottom: 4px;">יומן</div>
              <div style="font-size: 11px; color: #667a8a; line-height: 1.6; direction: rtl;">${(gameState?.log || []).slice(-10).reverse().map(l => `<div>${l}</div>`).join('')}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }
}

if (!checkURL()) {
  currentScreen = 'home';
}

render();
  </script>
</body>
</html>
